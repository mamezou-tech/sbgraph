name: Go

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

jobs:

  build:
    permissions:
      id-token: write
      contents: write
      attestations: write

    name: Build
    runs-on: ubuntu-latest

    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
      id: go

    - name: Test
      run: go test ./...

    - name: Build
      run: |
        GOOS=linux GOARCH=amd64 go build -trimpath -o build/linux-amd64/sbgraph .
        GOOS=linux GOARCH=arm64 go build -trimpath -o build/linux-arm64/sbgraph .
        GOOS=windows GOARCH=amd64 go build -trimpath -o build/windows/sbgraph.exe .
        GOOS=darwin GOARCH=amd64 go build -trimpath -o build/macos-amd64/sbgraph .
        GOOS=darwin GOARCH=arm64 go build -trimpath -o build/macos-arm64/sbgraph .

    - name: Archive
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        (cd build/linux-amd64 && tar cfvz ../sbgraph-linux-amd64.tar.gz sbgraph)
        (cd build/linux-arm64 && tar cfvz ../sbgraph-linux-arm64.tar.gz sbgraph)
        (cd build/windows && tar cfvz ../sbgraph-windows-amd64.tar.gz sbgraph.exe)
        (cd build/macos-amd64 && tar cfvz ../sbgraph-darwin-amd64.tar.gz sbgraph)
        (cd build/macos-arm64 && tar cfvz ../sbgraph-darwin-arm64.tar.gz sbgraph)

    - name: Generate artifact attestations
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: 'build/*.tar.gz'

    - name: Publish
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/*.tar.gz
